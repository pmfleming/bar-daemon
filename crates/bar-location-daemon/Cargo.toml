[package]
name = "bar-location-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { version = "0.1.0", path = "../../../daemon-framework/crates/shelllist-daemon-core" }
shelllist-daemon-tokio = { version = "0.1.0", path = "../../../daemon-framework/crates/shelllist-daemon-tokio" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.18", features = ["tokio"] }
zvariant = "5.13.1"
bar-location-api = { path = "../bar-location-api" }
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
zbus = { version = "5.18", features = ["p2p"] }
