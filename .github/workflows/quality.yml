name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-daemon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: bar-daemon
      # Co-development: test current upstream worktrees, never private lock pins.
      - name: Check out daemon framework
        uses: actions/checkout@v7
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - name: Check out Hyprland IPC
        uses: actions/checkout@v7
        with:
          repository: pmfleming/shelllist-hyprland
          ref: main
          path: shelllist-hyprland
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Format
        run: python3 ../daemon-framework/tools/local-build.py develop . --command cargo fmt --all -- --check
      - name: Clippy
        run: python3 ../daemon-framework/tools/local-build.py develop . --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Dependency policy
        run: |
          python3 ../daemon-framework/tools/local-build.py develop . --command cargo audit
          python3 ../daemon-framework/tools/local-build.py develop . --command cargo deny check
          python3 ../daemon-framework/tools/local-build.py develop . --command cargo shear
      # The dev shell supplies PipeWire; its ignored integration test uses an
      # explicit private socket and virtual devices, never host audio.
      - name: Test and collect coverage (including isolated PipeWire)
        run: python3 ../daemon-framework/tools/local-build.py develop . --command cargo llvm-cov --workspace --all-targets --locked --cobertura --output-path cobertura.xml -- --include-ignored
      - name: Check changed-line coverage
        if: github.event_name == 'pull_request'
        run: python3 ../daemon-framework/tools/local-build.py develop . --command diff-cover cobertura.xml --compare-branch origin/${{ github.base_ref }} --fail-under 80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: bar-daemon/cobertura.xml
