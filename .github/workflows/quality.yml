name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Format
        run: nix develop --command cargo fmt --all -- --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Dependency policy
        run: |
          nix develop --command cargo audit
          nix develop --command cargo deny check
          nix develop --command cargo shear
      - name: Test and collect coverage
        run: nix develop --command cargo llvm-cov --workspace --all-targets --locked --cobertura --output-path cobertura.xml
      - name: Check changed-line coverage
        if: github.event_name == 'pull_request'
        run: nix develop --command diff-cover cobertura.xml --compare-branch origin/${{ github.base_ref }} --fail-under 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cobertura.xml
