name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-daemon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: bar-daemon
      # Co-development: test current upstream worktrees, never private lock pins.
      - name: Check out daemon framework
        uses: actions/checkout@v7
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: actions/checkout@v7
        with:
          repository: pmfleming/rust-quality-lens
          path: rust-quality-lens
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: ../daemon-framework/tools/local-build develop . --command cargo fmt --all -- --check
      - name: Clippy
        run: ../daemon-framework/tools/local-build develop . --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build quality analyzer
        run: ../daemon-framework/tools/local-build develop . --command cargo build --locked --manifest-path ../rust-quality-lens/Cargo.toml --target-dir target/rqlens-ci --bin rqlens
      # The dev shell supplies PipeWire and the shared patched Hypridle package,
      # including HYPRIDLE_TEST_BIN. Both fixtures use private mock services.
      - name: Evidence runner regression tests
        run: python3 -B -m unittest discover -s tools -p 'test_quality_*.py'
      - name: Full fixtures, verification, measurements and strict quality gate
        env:
          QUALITY_EVIDENCE_DIR: target/ci-evidence
          RQLENS_BIN: target/rqlens-ci/debug/rqlens
        # Collect first; an incomplete architecture inventory must fail without
        # preventing fixture, dependency or coverage evidence from being saved.
        run: ../daemon-framework/tools/local-build develop . --command bash tools/quality-evidence.sh
      - name: Check changed-line coverage
        if: always() && github.event_name == 'pull_request'
        run: ../daemon-framework/tools/local-build develop . --command diff-cover target/ci-evidence/fixtures/cobertura.xml --compare-branch origin/${{ github.base_ref }} --fail-under 80
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-evidence
          path: bar-daemon/target/ci-evidence/
