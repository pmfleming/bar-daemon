name: mutation

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-daemon
    steps:
      - uses: actions/checkout@v7
        with:
          path: bar-daemon
      # Co-development: test current upstream worktrees, never private lock pins.
      - name: Check out daemon framework
        uses: actions/checkout@v7
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: dtolnay/rust-toolchain@stable
      - name: Test battery policy mutations
        run: |
          ../daemon-framework/tools/local-build develop . --command cargo mutants \
            --file src/battery/config.rs \
            --file src/battery/history.rs \
            --file src/battery/policy.rs \
            --timeout 120 --jobs 2 --cargo-arg=--locked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: bar-daemon/mutants.out
