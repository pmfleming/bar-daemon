name: mutation

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bar-daemon
    steps:
      - uses: actions/checkout@v7
        with:
          path: bar-daemon
      - name: Read dependency revisions
        id: dependencies
        run: |
          framework=$(jq -er '.nodes.daemonFramework.locked.rev' flake.lock)
          hyprland=$(jq -er '.nodes.hyprlandIpc.locked.rev' flake.lock)
          printf 'framework=%s\nhyprland=%s\n' "$framework" "$hyprland" >> "$GITHUB_OUTPUT"
      # Cargo path dependencies and local Nix inputs require sibling checkouts.
      - name: Check out daemon framework
        uses: actions/checkout@v7
        with:
          repository: pmfleming/daemon-framework
          ref: ${{ steps.dependencies.outputs.framework }}
          path: daemon-framework
      - name: Check out Hyprland IPC
        uses: actions/checkout@v7
        with:
          repository: pmfleming/shelllist-hyprland
          ref: ${{ steps.dependencies.outputs.hyprland }}
          path: shelllist-hyprland
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Test battery policy mutations
        run: |
          nix develop --command cargo mutants \
            --file src/battery/config.rs \
            --file src/battery/history.rs \
            --file src/battery/policy.rs \
            --timeout 120 --jobs 2 --cargo-arg=--locked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: bar-daemon/mutants.out
