project_name = "bar-daemon"
project_root = "."
fingerprint_inputs = [
  "protocols", "test_support", "docs/activity.example.json",
  "tools/quality-fixtures.sh", "tools/test_quality_fixtures.py",
  "tools/quality-evidence.sh", "tools/test_quality_evidence.py",
  ".github/workflows/quality.yml",
]
# source_roots is optional; Cargo workspace and local path packages are discovered automatically.
output_dir = "target/analysis"

[rust]
identity_resolution = "auto"
rust_analyzer = "rust-analyzer"
identity_timeout_seconds = 180
identity_offline = true
# This checkout and its Cargo dependencies are trusted to execute build-time code.
identity_build_macros = true

[verification]
timeout_seconds = 600
workspace = true
all_targets = true
# Match the private PipeWire/native-idle fixture selection in tools/quality-fixtures.sh.
include_ignored = true
all_features = false
locked = true
audit = true
deny = true
geiger = false
unused_dependencies = true
unused_dependency_backend = "cargo-shear"
semver = false
# Optional compiler-derived reachable API inventory (cargo-public-api):
public_api = false
feature_matrix = false
# Optional behavioral evidence (requires cargo-mutants):
mutation = false
# Set above 1 in CI to detect order-dependent or intermittent failures.
flaky_test_runs = 1
# Behavioral safety checks are opt-in and usually run on nightly:
fuzz_targets = []
fuzz_seconds = 30
sanitizers = [] # address, leak, memory, or thread
miri = false

# Cargo-qualified architecture constraints keep protocol and domain code
# independent from transport orchestration. api, daemon, and daemon::tasks are
# intentional composition roots; docs/quality-policy.md owns their fan-out baseline.
[[architecture.rules]]
id = "protocol-does-not-depend-on-api"
from = ["bar-daemon-core::shared::protocol", "bar-daemon-core::shared::protocol::audio_wire"]
deny = ["bar-daemon-core::shared::api", "bar-daemon-core::shared::api::**"]
level = "error"

[[architecture.rules]]
id = "domains-do-not-depend-on-transport"
from = [
  "bar-daemon-core::shared::activity::**",
  "bar-daemon-core::shared::audio",
  "bar-daemon-core::shared::audio::**",
  "bar-daemon-core::shared::battery::**",
  "bar-daemon-core::shared::brightness",
  "bar-daemon-core::shared::display_policy",
  "bar-daemon-core::shared::display_policy::**",
  "bar-daemon-core::shared::hyprland",
  "bar-daemon-core::shared::media",
  "bar-daemon-core::shared::osd_hardware",
  "bar-daemon-core::shared::power",
  "bar-daemon-core::shared::power::**",
  "bar-daemon-core::shared::sleep",
  "bar-daemon-core::shared::sleep::**",
  "bar-daemon-core::shared::sleep_policy",
  "bar-daemon-core::shared::sleep_policy::**",
  "bar-daemon-core::shared::timezone",
  "bar-daemon-core::shared::updates",
  "bar-daemon-core::shared::updates::**",
  "bar-daemon-core::shared::work_area",
]
deny = [
  "bar-daemon-core::shared::api",
  "bar-daemon-core::shared::api::**",
  "bar-daemon-core::shared::daemon",
  "bar-daemon-core::shared::daemon::**",
  "bar-daemon-core::shared::client",
]
level = "error"

[[architecture.rules]]
id = "state-does-not-depend-on-effects"
from = ["bar-daemon-core::shared::state"]
deny = [
  "bar-daemon-core::shared::audio",
  "bar-daemon-core::shared::audio::**",
  "bar-daemon-core::shared::battery::**",
  "bar-daemon-core::shared::brightness",
  "bar-daemon-core::shared::hyprland",
  "bar-daemon-core::shared::media",
  "bar-daemon-core::shared::power",
  "bar-daemon-core::shared::power::**",
  "bar-daemon-core::shared::sleep",
  "bar-daemon-core::shared::sleep::**",
  "bar-daemon-core::shared::updates",
  "bar-daemon-core::shared::updates::**",
]
level = "error"

# Stable rule limits prevent new findings while allowing an explicit baseline:
# [policy.rules."rust.reliability.expect"]
# level = "error"
# max = 0
# exclude_paths = ["src/generated/**"]
# exclude_packages = ["generated-bindings"]

# Temporary exceptions must be owned, justified, and time-bounded:
# [[policy.waivers]]
# rule_id = "rust.project.license"
# reason = "Owner license decision is pending"
# owner = "project-maintainers"
# expires = "2026-12-31"
