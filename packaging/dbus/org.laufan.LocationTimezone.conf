<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="automatic-timezoned">
    <allow own="org.laufan.LocationTimezone"/>
  </policy>
  <policy context="default">
    <!-- The method authorizes the sender through polkit before reading coordinates. -->
    <allow send_destination="org.laufan.LocationTimezone"
           send_interface="org.laufan.LocationTimezone"
           send_member="GetAccepted"/>
  </policy>
</busconfig>
