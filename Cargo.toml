[package]
name = "bar-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Status, policy, and action daemon for a Quickshell desktop bar"
repository = "https://github.com/pmfleming/bar-daemon"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures = "0.3"
ksni = "0.3"
notify = "8"
pipewire = { version = "0.10", features = ["v1_2_0"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
shelllist-daemon-core = { version = "0.1.0", path = "../daemon-framework/crates/shelllist-daemon-core" }
shelllist-daemon-tokio = { version = "0.1.0", path = "../daemon-framework/crates/shelllist-daemon-tokio" }
shelllist-hyprland = { version = "0.1.0", path = "../daemon-framework/crates/shelllist-hyprland" }
shelllist-update-status = { path = "../update-daemon/crates/shelllist-update-status" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tempfile = "3"
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
zbus = { version = "5.18", features = ["tokio"] }
zvariant = "5.13.1"
wayland-client = "0.31"
wayland-scanner = "0.31"

[dev-dependencies]
# Producer-to-reader tests link the actual worker, never its privileged entrypoint.
update-worker = { path = "../update-daemon" }
tokio = { version = "1", features = ["test-util"] }
wayland-server = "0.31"
zbus = { version = "5.18", features = ["p2p"] }
