[package]
name = "bar-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Status, policy, and action daemon for a Quickshell desktop bar"
repository = "https://github.com/pmfleming/bar-daemon"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures = "0.3"
notify = "8"
pipewire = { version = "0.10", features = ["v1_2_0"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { git = "https://github.com/pmfleming/daemon-framework.git", rev = "a1b2695d179cca3665645db0c8e9f1a413e53ac6" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
zbus = { version = "5", features = ["tokio"] }
zvariant = "5"

[dev-dependencies]
tempfile = "3"
