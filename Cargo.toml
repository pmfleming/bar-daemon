[workspace]
members = [".", "crates/*"]
resolver = "3"

[package]
name = "bar-daemon"
default-run = "bar-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Independent desktop session daemons and command-line clients"
repository = "https://github.com/pmfleming/bar-daemon"

[[test]]
name = "workspace_handoff"
path = "tests/workspace_handoff.rs"
required-features = ["native-workspace-handoff"]

[features]
native-quickshell-socket = ["bar-daemon-core/native-quickshell-socket"]
native-workspace-handoff = ["bar-daemon-core/native-workspace-handoff"]

[dependencies]
bar-daemon-core = { path = "crates/bar-daemon-core" }
bar-status = { path = "crates/bar-status" }
bar-power = { path = "crates/bar-power" }
bar-compositor = { path = "crates/bar-compositor" }
bar-activity = { path = "crates/bar-activity" }
bar-notification = { path = "crates/bar-notification" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
zvariant = "5.13.1"
futures = "0.3"
tempfile = "3"
shelllist-hyprland = { path = "../daemon-framework/crates/shelllist-hyprland" }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "time", "test-util"] }
zbus = { version = "5.18", features = ["tokio", "p2p"] }
wayland-server = "0.31"
wayland-scanner = "0.31"
